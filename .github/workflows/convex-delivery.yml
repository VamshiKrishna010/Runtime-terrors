name: Convex delivery

on:
  # Every pull request gets validation before it can be merged. The closed
  # event is needed to detect an approved development-to-main merge.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  # A completed merge to either development branch validates, then deploys the
  # Convex development deployment.
  push:
    branches: [pre-dev, dev]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: convex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: backend
      - run: python -m compileall -q app
        working-directory: backend

  ml-ci:
    name: ML CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ml_service/requirements.txt
            ml_service/requirements-dev.txt
      - run: python -m pip install -r ml_service/requirements-dev.txt
      - run: python -m ml_service.validate_seed
      - run: python -m unittest discover -s ml_service/tests -v

  deploy-development:
    name: Deploy Convex development
    needs: [frontend-ci, backend-ci, ml-ci]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/pre-dev' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    environment: convex-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Deploy functions to Convex development
        run: npx convex deploy
        working-directory: frontend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

  deploy-production:
    name: Deploy Convex production
    needs: [frontend-ci, backend-ci, ml-ci]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      (github.event.pull_request.head.ref == 'pre-dev' || github.event.pull_request.head.ref == 'dev')
    runs-on: ubuntu-latest
    environment: convex-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Deploy Convex production and build the frontend
        run: npx convex deploy --cmd "npm run build"
        working-directory: frontend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_DEPLOY_TARGET: github-pages
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Publish frontend to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
