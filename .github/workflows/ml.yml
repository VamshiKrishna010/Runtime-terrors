name: ML setup checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml_service/requirements.txt
            ml_service/requirements-dev.txt
      - name: Install ML setup dependencies
        run: python -m pip install -r ml_service/requirements-dev.txt
      - name: Validate labeled reports
        run: python -m ml_service.validate_seed
      - name: Check ML API contracts
        run: python -m unittest discover -s ml_service/tests -v
