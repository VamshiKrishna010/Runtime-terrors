name: Frontend checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find frontend
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          elif [[ -f frontend/package.json ]]; then
            echo "APP_DIR=frontend" >> "$GITHUB_ENV"
          else
            echo "No frontend package.json found at the repository root or in frontend/."
            echo "APP_DIR=" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        if: env.APP_DIR != ''
        shell: bash
        run: |
          cd "$APP_DIR"
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Run frontend tests
        if: env.APP_DIR != ''
        shell: bash
        run: |
          cd "$APP_DIR"
          npm test --if-present

      - name: Build frontend
        if: env.APP_DIR != ''
        shell: bash
        run: |
          cd "$APP_DIR"
          npm run build --if-present